<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>German lookup</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><div class="mark">DE</div><div><strong>German lookup</strong><small>Powered by Verbformen</small></div></header>
    <form id="search-form"><input id="word" autocomplete="off" placeholder="German word" aria-label="German word"><button>Look up</button></form>
    <section id="result" aria-live="polite"><p class="hint">Select a German word, right-click, then choose “Look up German”.</p></section>
    <footer><a id="source" target="_blank" rel="noreferrer">Open on Verbformen ↗</a></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
