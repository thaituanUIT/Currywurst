<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>German lookup</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><div class="brand-mark">W</div><span>Wortblick</span><span class="source-label">GERMAN → ENGLISH</span></header>
    <form id="search-form"><input id="word" autocomplete="off" placeholder="Look up a German word" aria-label="German word"><button aria-label="Search">↵</button></form>
    <section id="result" aria-live="polite"><p class="hint">Select a word on a page, then right-click to look it up.</p></section>
    <footer><a id="source" target="_blank" rel="noreferrer">Source: Verbformen ↗</a></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
